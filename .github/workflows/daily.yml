name: 兜兜的每日日记 🐣

on:
  schedule:
    # 北京时间 19:30（UTC 11:30），每天自动跑
    - cron: '30 11 * * *'
  workflow_dispatch:  # 允许手动触发（测试用）

# 关键：必须显式声明 contents: write，否则 GITHUB_TOKEN 默认只读
# 这是 memory 没保存、每天显示"第 1 天"的根因
permissions:
  contents: write

jobs:
  daily-diary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ 拉代码
        uses: actions/checkout@v4

      - name: 🐍 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 装 Playwright（用于 HTML 转 PNG）
        run: |
          playwright install --with-deps chromium

      - name: 🔍 抓取信息源
        run: python scripts/fetch.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: ✍️ 兜兜写文案
        run: python scripts/compose.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: 🎨 渲染配图
        run: python scripts/render.py

      - name: 📬 发邮件
        run: python scripts/notify.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 💾 自动提交今日成稿到仓库
        run: |
          git config user.name "兜兜 🐣"
          git config user.email "dudu@bot.local"
          git add posts/ output/ memory/ || true
          if git diff --staged --quiet; then
            echo "[git] 没有变更，跳过提交"
          else
            # 用 fetch_meta.json 里的物理 day（最可靠）
            DAY_NUM=$(python -c "import json; d=json.load(open('output/fetch_meta.json')); print(d.get('dudu_day','?'))" 2>/dev/null || echo "?")
            git commit -m "🐣 兜兜的第 ${DAY_NUM} 天日记 ($(date -u +'%Y-%m-%d'))"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "[git] push 成功 ✅"
                break
              fi
              echo "[git] push 失败，第 $i 次重试..."
              sleep 3
            done
          fi
